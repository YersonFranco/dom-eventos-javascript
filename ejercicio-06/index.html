<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 06 - Calculadora de IMC</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Calculadora de IMC</h1>
        <p>Ingresa tu peso en kilogramos y tu estatura en metros.</p>
        <label for="peso">Peso (kg)</label>
        <input id="peso" type="number" min="0" step="any" placeholder="Ejemplo: 70">
        <label for="estatura">Estatura (m)</label>
        <input id="estatura" type="number" min="0" step="any" placeholder="Ejemplo: 1.75">
        <button id="botonCalcular" type="button">Calcular IMC</button>
        <p id="resultado" class="resultado" aria-live="polite"></p>
        <a href="../index.html">Volver al inicio</a>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
