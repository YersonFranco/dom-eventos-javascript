<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15 - Gestor de tareas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Gestor de tareas</h1>
        <label for="nuevaTarea">Nueva tarea</label>
        <input id="nuevaTarea" type="text" placeholder="Ejemplo: Estudiar JavaScript">
        <label for="prioridad">Prioridad</label>
        <select id="prioridad">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
        </select>
        <button id="botonAgregar" type="button">Agregar tarea</button>
        <p id="aviso" class="aviso" aria-live="polite"></p>
        <p id="contadorPendientes" class="contador">Tareas pendientes: 0</p>
        <label for="filtro">Mostrar</label>
        <select id="filtro">
            <option value="todas">Todas las tareas</option>
            <option value="pendientes">Solo pendientes</option>
            <option value="completadas">Solo completadas</option>
        </select>
        <ul id="listaTareas"></ul>
        <p id="mensajeMouse" class="mensaje-mouse" aria-live="polite"></p>
        <a href="../index.html">Volver al inicio</a>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
