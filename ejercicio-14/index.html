<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14 - Calculadora de presupuesto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="../css/navegacion.css">
</head>
<body>
<nav class="navegacion-ejercicios" aria-label="Navegación entre ejercicios">
    <span class="nombre-navegacion">DOM y eventos</span>
    <a class="nav-inicio" href="../index.html">Todos los ejercicios</a>
    <div class="nav-pasos"><a href="../ejercicio-13/index.html">← Anterior</a><a href="../ejercicio-15/index.html">Siguiente →</a></div>
</nav>
    <main class="contenedor">
        <span class="etiqueta">Ejercicio 14</span>
        <h1>Calculadora de presupuesto</h1>
        <section class="bloque">
            <h2>Presupuesto inicial</h2>
            <label for="presupuesto">Dinero disponible</label>
            <div class="fila">
                <input id="presupuesto" type="number" min="0" step="any" placeholder="Ejemplo: 100000">
                <button id="botonPresupuesto" type="button">Guardar</button>
            </div>
        </section>
        <section class="bloque">
            <h2>Agregar un gasto</h2>
            <label for="nombreGasto">Nombre del gasto</label>
            <input id="nombreGasto" type="text" placeholder="Ejemplo: Transporte">
            <label for="valorGasto">Valor</label>
            <input id="valorGasto" type="number" min="0" step="any" placeholder="Ejemplo: 5000">
            <button id="botonAgregarGasto" type="button">Agregar gasto</button>
        </section>
        <p id="aviso" class="aviso" aria-live="polite"></p>
        <section class="resumen">
            <h2>Resumen</h2>
            <p>Presupuesto inicial: <strong id="totalPresupuesto">$0</strong></p>
            <p>Total gastado: <strong id="totalGastado">$0</strong></p>
            <p>Dinero restante: <strong id="dineroRestante">$0</strong></p>
            <p id="mensajePresupuesto" class="mensaje"></p>
        </section>
        <h2>Gastos registrados</h2>
        <ul id="listaGastos"></ul>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
