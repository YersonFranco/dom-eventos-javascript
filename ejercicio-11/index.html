<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - Registro con validación</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="../css/navegacion.css">
</head>
<body>
<nav class="navegacion-ejercicios" aria-label="Navegación entre ejercicios">
    <span class="nombre-navegacion">DOM y eventos</span>
    <a class="nav-inicio" href="../index.html">Todos los ejercicios</a>
    <div class="nav-pasos"><a href="../ejercicio-10/index.html">← Anterior</a><a href="../ejercicio-12/index.html">Siguiente →</a></div>
</nav>
    <main class="contenedor">
        <span class="etiqueta">Ejercicio 11</span>
        <h1>Formulario de registro</h1>
        <p>Completa tus datos para registrarte.</p>
        <form id="formularioRegistro" novalidate>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" autocomplete="name">
            <small id="errorNombre" class="error"></small>

            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" autocomplete="email">
            <small id="errorCorreo" class="error"></small>

            <label for="edad">Edad</label>
            <input id="edad" type="number" min="0" step="1">
            <small id="errorEdad" class="error"></small>

            <button type="submit">Registrarme</button>
        </form>
        <p id="mensajeExito" class="exito" aria-live="polite"></p>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
