<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio 04 - Cambiador de color</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <h1>Cambiador de color</h1>

    <div id="tarjeta">

        <h2>Mi tarjeta</h2>

        <p>Esta tarjeta cambiará de color cuando selecciones una opción.</p>

    </div>

    <br>

    <label for="selectorColor">Selecciona un color:</label>

    <select id="selectorColor">

        <option value="">Selecciona un color</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="yellow">Amarillo</option>
        <option value="pink">Rosa</option>

    </select>

    <script src="js/app.js"></script>

</body>

</html>
