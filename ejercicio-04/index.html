    <main class="contenedor">
        <span class="etiqueta">Ejercicio 04</span>
        <h1>Cambiador de color</h1>
        <p>Selecciona un color para cambiar el fondo de la tarjeta.</p>
        <article id="tarjeta" class="tarjeta-color">
            <h2>Mi tarjeta</h2>
            <p>El contenido permanece mientras cambia el color.</p>
        </article>
        <label for="selectorColor">Color de fondo</label>
        <select id="selectorColor">
            <option value="" selected disabled>Selecciona un color</option>
            <option value="#bfdbfe">Azul</option>
            <option value="#bbf7d0">Verde</option>
            <option value="#fef08a">Amarillo</option>
            <option value="#fbcfe8">Rosa</option>
        </select>
    </main>
    <script src="js/app.js"></script>
</body>
